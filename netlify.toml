# QrJoke : site 100 % statique, le temps réel passe par un broker MQTT public (voir site/core.js).
[build]
  publish = "site"

# /r/42 (QR smartphone) sert la page récepteur ; le code est lu dans l'URL.
[[redirects]]
  from = "/r/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/remote"
  to = "/remote.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    Cache-Control = "no-cache"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
